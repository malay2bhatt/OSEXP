      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        #notifPermissionBanner {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          background: linear-gradient(135deg, #4A3E72, #7030A0);
          color: #fff;
          padding: 10px 16px;
          font-size: 13px;
          font-weight: 700;
          z-index: 999999;
          box-shadow: 0 4px 15px rgba(0,0,0,0.3);
          justify-content: space-between;
          align-items: center;
        }
        #notifPermissionBanner button {
          background: #10B981;
          color: #fff;
          border: none;
          padding: 6px 14px;
          border-radius: 8px;
          font-size: 12px;
          font-weight: 800;
          cursor: pointer;
        }
      </style>
    </head>
    <body>
      <!-- 1-Click Banner for Top-Level Browser Notification Authorization -->
      <div id="notifPermissionBanner">
        <span>🔔 Click to allow Windows Desktop notifications for Ornate memos and updates</span>
        <div style="display:flex; gap:8px;">
          <button onclick="requestTopNotifPermission()">Allow Notifications</button>
          <button onclick="dismissBanner()" style="background:rgba(255,255,255,0.2);">✕</button>
        </div>
      </div>

      <!-- Floating Quick Test & Live Status Pill in Bottom Right -->
      <div id="notifTestPill" style="position:fixed; bottom:12px; right:12px; z-index:999999; display:flex; gap:8px; background:rgba(15,23,42,0.92); border:1px solid rgba(255,255,255,0.2); border-
  radius:20px; padding:5px 12px; backdrop-filter:blur(10px); align-items:center; box-shadow:0 4px 15px rgba(0,0,0,0.5);">
        <span id="notifLiveStatus" style="font-size:11px; color:#38BDF8; font-weight:700;">📡 Bridge: Ready</span>
        <button onclick="testDirectCard()" style="background:#0284C7; color:#fff; border:none; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:700; cursor:pointer;">🧪 Test Card</button>
        <button onclick="document.getElementById('notifTestPill').style.display='none'" style="background:transparent; color:#64748B; border:none; font-size:11px; cursor:pointer; padding:0 2px;">✕</button>
      </div>

      <!-- Dynamic Iframe with Multi-Account Authuser Resolution -->
      <iframe id="mainFrame" src="https://script.google.com/macros/s/AKfycby3xofAZ-6_P0EhUSayUmxBbDXpcJjvmRjbGCmGqYQrv70kqm0kRs7FohdyB29Ull6a/exec?authuser=0" allow="clipboard-read; clipboard-write; camera;
  microphone; geolocation; fullscreen; payment" allowfullscreen></iframe>

      <script>
        // 1. Dynamic URL & Multi-Account Parameter Handler
        (function() {
          try {
            var base = "https://script.google.com/macros/s/AKfycby3xofAZ-6_P0EhUSayUmxBbDXpcJjvmRjbGCmGqYQrv70kqm0kRs7FohdyB29Ull6a/exec";
            var params = new URLSearchParams(window.location.search);
            var authUser = params.get("authuser") || params.get("u") || "0";

            var separator = base.indexOf("?") === -1 ? "?" : "&";
            var targetUrl = base + separator + "authuser=" + encodeURIComponent(authUser);

            params.forEach(function(val, key) {
              if (key !== "authuser" && key !== "u") {
                targetUrl += "&" + encodeURIComponent(key) + "=" + encodeURIComponent(val);
              }
            });

            var frame = document.getElementById("mainFrame");
            if (frame && frame.src !== targetUrl) {
              frame.src = targetUrl;
            }
          } catch(e) {}
        })();

        // 2. Desktop Notification Authorization & Bridge
        function checkPermission() {
          if (!("Notification" in window)) return;
          if (Notification.permission === "default") {
            var banner = document.getElementById("notifPermissionBanner");
            if (banner) banner.style.display = "flex";
          }
        }

        function requestTopNotifPermission() {
          if (!("Notification" in window)) return;
          Notification.requestPermission().then(function(perm) {
            var banner = document.getElementById("notifPermissionBanner");
            if (banner) banner.style.display = "none";
            if (perm === "granted") {
              new Notification("Ornate Std Support", {
                body: "Windows Desktop notifications are now enabled!",
                tag: "ornate-welcome"
              });
            }
          });
        }

        function dismissBanner() {
          var banner = document.getElementById("notifPermissionBanner");
          if (banner) banner.style.display = "none";
        }

        // Direct Instant Test Function from Wrapper
        function testDirectCard() {
          if (!("Notification" in window)) {
            alert("Notification API is not supported in this browser.");
            return;
          }
          if (Notification.permission !== "granted") {
            Notification.requestPermission().then(function(perm) {
              if (perm === "granted") {
                fireTestCard();
              } else {
                alert("Notification permission is currently: " + perm);
              }
            });
          } else {
            fireTestCard();
          }
          function fireTestCard() {
            try {
              var n = new Notification("🧪 Windows Desktop Card Test", {
                body: "Direct test from GitHub Pages wrapper! If you see this in the corner, notifications are working 100%.",
                tag: "ornate-test-" + Date.now()
              });
              n.onclick = function() {
                window.focus();
                n.close();
              };
              console.log("[Portal Wrapper] Direct test card created successfully!");
            } catch(err) {
              console.error("[Portal Wrapper] Test card error:", err);
            }
          }
        }

        // Check permission on initial load
        setTimeout(checkPermission, 1500);

        // 3. PostMessage Listener: Catch events from the inner dashboard and display native Windows OS cards!
        var _receivedAlertCount = 0;
        window.addEventListener("message", function(event) {
          if (!event.data) return;

          var data = event.data;
          if (typeof data === "string") {
            try {
              if (data.indexOf("ORNATE_TRIGGER_DESKTOP_NOTIF") !== -1 || data.indexOf("DESKTOP_NOTIF") !== -1) {
                data = JSON.parse(data);
              }
            } catch (e) {}
          }

          console.log("[Portal Wrapper] Received message event:", data);

          if (data && (data.type === "ORNATE_TRIGGER_DESKTOP_NOTIF" || data.type === "DESKTOP_NOTIF")) {
            _receivedAlertCount++;
            var statusEl = document.getElementById("notifLiveStatus");
            if (statusEl) {
              statusEl.style.color = "#4ADE80";
              statusEl.innerText = "✅ Received (" + _receivedAlertCount + ")";
            }

            console.log("[Portal Wrapper] Processing desktop notification for memo:", data.memoId || "unspecified");

            if ("Notification" in window && Notification.permission === "granted") {
              try {
                var title = data.title || "Ornate Support Dashboard";
                var body = data.body || data.message || "New update received";
                var tagId = "memo-" + (data.memoId || Date.now());
                var n = new Notification(title, {
                  body: body,
                  tag: tagId
                });
                console.log("[Portal Wrapper] Native Windows Notification created successfully for tag:", tagId);
                n.onclick = function() {
                  window.focus();
                  n.close();
                };
              } catch(err) {
                console.error("[Portal Wrapper] Notification display error:", err);
              }
            } else {
              console.warn("[Portal Wrapper] Notification skipped - permission state is:", (window.Notification ? Notification.permission : "unsupported"));
            }
          }
        });
      </script>
    </body>
    </html>
